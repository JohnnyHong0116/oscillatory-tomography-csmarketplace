[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscillatory-tomography"
version = "0.1.0"
description = "Open-source Python port of the oscillatory hydraulic tomography MATLAB workflow"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "pillow>=12",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
